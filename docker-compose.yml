services:
  localstack:
    image: localstack/localstack:3.4
    container_name: localstack-main
    # Pregunta secreta: ¿qué puerto de tu máquina expone LocalStack y para qué sirve?
    # Respóndela en tu README, en una línea que empiece con el ícono 🔐 antes de la respuesta.
    ports:
      - "127.0.0.1:4566:4566"
    environment:
      - SERVICES=sqs,s3,dynamodb,kms
      - DEBUG=1
    volumes:
      - "${LOCALSTACK_VOLUME_DIR:-./.localstack}:/var/lib/localstack"
    networks:
      - pipeline-net

  worker:
    build:
      context: ./src/worker
      dockerfile: Dockerfile
    container_name: pipeline-worker
    environment:
      - AWS_ENDPOINT_URL=http://localstack:4566
      - AWS_DEFAULT_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=mock_key
      - AWS_SECRET_ACCESS_KEY=mock_secret
      - SQS_QUEUE_URL=http://localstack:4566/000000000000/transactions-queue
      - S3_BUCKET_NAME=corporate-transactions-raw-payloads
      - DYNAMODB_TABLE_NAME=transactions
    depends_on:
      - localstack
    networks:
      - pipeline-net

networks:
  pipeline-net:
    driver: bridge
